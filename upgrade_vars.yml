---
# Defaults for upgrade.yml. Override with -e. Build must already be reachable by the box
# (file:///var/nsinstall/... pre-staged, or https/sftp URL). No credentials in the URL - use file://.
upgrade_confirm: false
upgrade_mode: normal          # normal | issu (In Service Software Upgrade, keeps sessions via nsmigration)
upgrade_target_version: "CHANGE_ME"   # e.g. 14.1-51.80 (FIPS: must be in mpx_fips_approved_builds)
upgrade_build_url: "CHANGE_ME"        # e.g. file:///var/nsinstall/build-14.1-51.80_nc_64.tgz (FIPS image on FIPS)
upgrade_reboot_pause_s: 120
upgrade_settle_s: 60
upgrade_issu_poll_retries: 20
upgrade_failback: true
