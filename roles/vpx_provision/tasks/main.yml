---
# Field names follow the SDX NITRO "ns" resource. UNVERIFIED: num_pes, number_of_ssl_cores,
# license, cpu_core_sharing value mapping, and per-interface vlan_filtering / allowed VLAN fields.
- name: List VPX instances already on this SDX (read-only)
  ansible.builtin.uri:
    url: "{{ nitro_base }}/config/ns"
    headers: "{{ nitro_headers }}"
    validate_certs: "{{ nitro_validate_certs }}"
  register: vpx_provision_existing
  check_mode: false
  delegate_to: localhost
  no_log: true

- name: Existing instance names
  ansible.builtin.set_fact:
    vpx_provision_names: "{{ vpx_provision_existing.json.ns | default([]) | map(attribute='name') | list }}"

- name: Already provisioned - skipped (not modified; change sizing in the MS GUI on purpose)
  ansible.builtin.debug:
    msg: "{{ item.name }} already exists on {{ inventory_hostname }} - skipped."
  loop: "{{ vpx_instances | selectattr('sdx_host', 'equalto', inventory_hostname) | selectattr('name', 'in', vpx_provision_names) | list }}"
  loop_control: {label: "{{ item.name }}"}

- name: Provision VPX instances that belong to this SDX (only missing ones)
  ansible.builtin.uri:
    url: "{{ nitro_base }}/config/ns"
    method: POST
    headers: "{{ nitro_headers }}"
    body_format: json
    body:
      ns:
        name: "{{ item.name }}"
        ip_address: "{{ item.nsip }}"
        netmask: "{{ item.netmask }}"
        gateway: "{{ item.gateway }}"
        image_name: "{{ vpx_xva_name }}"
        profile_name: "{{ admin_profile_name }}"
        vm_memory_total: "{{ (item.memory_gb * 1024) | int }}"
        num_pes: "{{ item.packet_engines }}"  # UNVERIFIED field name
        number_of_ssl_cores: "{{ item.ssl_cores }}"  # UNVERIFIED field name
        throughput: "{{ item.throughput_mbps }}"
        license: "{{ item.license_edition }}"  # UNVERIFIED field name
        cpu_core_sharing: "{{ item.cpu_core_sharing }}"  # UNVERIFIED field name
        # UNVERIFIED field names: vlan_filtering, vlan_whitelist_array
        network_interfaces: >-
          {% set nif = namespace(l=[]) %}{% for i in item.interfaces %}{% set nif.l = nif.l + [{'port_name': i.port_name,
          'vlan_filtering': i.vlan_filtering, 'vlan_whitelist_array': i.allowed_vlans}] %}{% endfor %}{{ nif.l }}
    status_code: [200, 201, 202]
    validate_certs: "{{ nitro_validate_certs }}"
    timeout: 1800
  loop: "{{ vpx_instances | selectattr('sdx_host', 'equalto', inventory_hostname) | rejectattr('name', 'in', vpx_provision_names) | list }}"
  loop_control: {label: "{{ item.name }}"}
  delegate_to: localhost
  no_log: true
