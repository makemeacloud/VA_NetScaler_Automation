---
# EXAMPLE ONLY. 8 sites, 1 HA pair each (Phase 1 design outline). All addresses are CHANGE_ME.
# Group/host keys are working labels, NOT the agreed naming standard (<site>-<adc>-<01|02> is still to confirm).
# platform: mpx | sdx  (large sites are OPEN: SDX 17000 or MPX 17000)
all:
  children:
    adc_sites:
      children:
        site_cle:
          vars:
            site_name: "Cleveland Lab"
            site_size: small
            platform: "mpx"   # from slides
            platform_model: "mpx9200fips"   # MPX 9200 FIPS
            fips_required: true
            ha_inc_mode: false   # CHANGE_ME: true if the two NSIPs are on different subnets
            ha_peer_id: 1        # hanode id of the peer entry (1-64), same on both nodes
          hosts:
            cle_adc_01:
              ansible_host: "CHANGE_ME_NSIP"
              nsip_netmask: "CHANGE_ME_MASK"
              ha_peer: cle_adc_02
              hostname: "CHANGE_ME_HOSTNAME"
            cle_adc_02:
              ansible_host: "CHANGE_ME_NSIP"
              nsip_netmask: "CHANGE_ME_MASK"
              ha_peer: cle_adc_01
              hostname: "CHANGE_ME_HOSTNAME"
