# ================= cle_adc_02.conf  (Cleveland Lab, MPX 9200 - non-FIPS) =================
# THIS BOX IS THE HA SECONDARY. ORDER: run cle_adc_01.conf Part A, then cle_adc_02.conf Part A,
# then 01 Part B, then 02 Part B, then 01 Part C, then 02 Part C. Do not run two boxes' parts at the same time.
# FILL IN EVERY <PLACEHOLDER> BEFORE YOU RUN THIS FILE. Use Notepad: Edit > Replace.
#
#   <HOSTNAME>          name of this box, e.g. cle-adc-0x
#   <NSIP>              this box's management IP (the one you SSH to)
#   <NSIP_MASK>         netmask of the NSIP, e.g. 255.255.255.0
#   <PEER_NSIP>         management IP of the other box (cle_adc_01)
#   <RPC_PASSWORD>      HA sync password. SAME on both boxes. (scripts: vault_rpc_node_password)
#
# NO SNIP, route, DNS, NTP or timezone on this box: HA sync copies them from 01 (the primary).
# ============================================================================

# ======== PART A (after 01 Part A) ========
set ns hostName <HOSTNAME>

# NSIP: only if not already set on the console. The new NSIP does NOT take effect right away:
# it needs a save AND a reboot. Run these three on the CURRENT (bootstrap) IP, then reconnect to the
# new IP after the reboot (several minutes) and carry on below.
# set ns config -IPAddress <NSIP> -netmask <NSIP_MASK>
# save ns config
# reboot

set ns ip <NSIP> -gui SECUREONLY

# ---- FIPS section: ONLY FOR FIPS BOXES - SKIP on Cleveland/Martinsburg (non-FIPS) ----
# show system fipsStatus / set system parameter -strongPassword enableall
# ---- end FIPS section ----

# Lock this box as SECONDARY before any peer exists, so 01's config wins the first sync
set ha node -haStatus STAYSECONDARY
set ns rpcNode <NSIP> -password <RPC_PASSWORD> -secure YES
# The peer's RPC node entry may not exist yet: add it. "Resource already exists" here is harmless;
# then the set line below updates it.
add ns rpcNode <PEER_NSIP> -password <RPC_PASSWORD> -secure YES
set ns rpcNode <PEER_NSIP> -password <RPC_PASSWORD> -secure YES
save ns config

# License: LAS WARM-REBOOTS the box. Only after 01 is back up. One box at a time.

# ======== PART B (after 01 Part B) ========
add ha node 1 <PEER_NSIP> -inc DISABLED
# INC NOTE: if this box and cle_adc_01 are on DIFFERENT subnets, use instead:
# add ha node 1 <PEER_NSIP> -inc ENABLED
# Wait, then check:  show ha node   -> node 0 Secondary, peer UP, sync SUCCESS. Do not go on until it does.
save ns config

# ======== PART C (after 01 Part C) ========
set ha node -haStatus ENABLED
save ns config
