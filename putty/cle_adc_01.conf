# ================= cle_adc_01.conf  (Cleveland Lab, MPX 9200 - non-FIPS) =================
# THIS BOX IS THE HA PRIMARY. ORDER: run cle_adc_01.conf Part A, then cle_adc_02.conf Part A,
# then 01 Part B, then 02 Part B, then 01 Part C, then 02 Part C. Do not run two boxes' parts at the same time.
# FILL IN EVERY <PLACEHOLDER> BEFORE YOU RUN THIS FILE. Use Notepad: Edit > Replace.
#
#   <HOSTNAME>          name of this box, e.g. cle-adc-0x
#   <NSIP>              this box's management IP (the one you SSH to)
#   <NSIP_MASK>         netmask of the NSIP, e.g. 255.255.255.0
#   <PEER_NSIP>         management IP of the other box (cle_adc_02)
#   <RPC_PASSWORD>      HA sync password. SAME on both boxes. (scripts: vault_rpc_node_password)
#   <SNIP> <SNIP_MASK>  subnet IP for traffic          (EXTRA - not in the scripts)
#   <GATEWAY>           default gateway                (EXTRA)
#   <DNS1> <DNS2>       DNS servers   (scripts: mpx_dns_servers)
#   <NTP1> <NTP2>       NTP servers   (scripts: mpx_ntp_servers)
#   <TIMEZONE>          e.g. GMT-05:00-EST-America/New_York   (EXTRA)
#
# SNIP, route, DNS, NTP and timezone go ONLY on this box (01). HA sync copies them to 02.
# Putting the same SNIP on both boxes before pairing causes an IP conflict.
# Lines marked EXTRA are not done by the scripts. Lines starting with # are notes.
# ============================================================================

# ======== PART A (run first, before anything on 02) ========
set ns hostName <HOSTNAME>

# NSIP: only if not already set on the console. The new NSIP does NOT take effect right away:
# it needs a save AND a reboot. Run these three on the CURRENT (bootstrap) IP, then reconnect to the
# new IP after the reboot (several minutes) and carry on below.
# set ns config -IPAddress <NSIP> -netmask <NSIP_MASK>
# save ns config
# reboot

add ns ip <SNIP> <SNIP_MASK> -type SNIP -mgmtAccess DISABLED
add route 0.0.0.0 0.0.0.0 <GATEWAY>
set ns param -timezone <TIMEZONE>
add dns nameServer <DNS1>
add dns nameServer <DNS2>
add ntp server <NTP1>
add ntp server <NTP2>
enable ntp sync

# HTTPS-only GUI (any box, FIPS or not). Changes only the gui setting of the NSIP.
set ns ip <NSIP> -gui SECUREONLY

# ---- FIPS section: ONLY FOR FIPS BOXES - SKIP on Cleveland/Martinsburg (non-FIPS) ----
# show system fipsStatus        -> must say "operating in FIPS mode"
# set system parameter -strongPassword enableall
# Never run "reset fips" or "set fips -initHSM" on MPX 9200 FIPS.
# ---- end FIPS section ----

# HA prep: lock this box as primary BEFORE any peer exists
set ha node -haStatus STAYPRIMARY
set ns rpcNode <NSIP> -password <RPC_PASSWORD> -secure YES
# The peer's RPC node entry may not exist yet: add it. "Resource already exists" here is harmless;
# then the set line below updates it.
add ns rpcNode <PEER_NSIP> -password <RPC_PASSWORD> -secure YES
set ns rpcNode <PEER_NSIP> -password <RPC_PASSWORD> -secure YES
save ns config

# License: LAS is NITRO-only (GUI or the script's las_apply). It WARM-REBOOTS the box.
# Run "save ns config" first (done just above). License ONE box at a time; wait until it is back.

# ======== PART B (after 02 Part A is done) ========
add ha node 1 <PEER_NSIP> -inc DISABLED
# INC NOTE: if this box and cle_adc_02 are on DIFFERENT subnets, use instead:
# add ha node 1 <PEER_NSIP> -inc ENABLED
set system parameter -promptString %u@%s
save ns config

# ======== PART C (after 02 Part B, and "show ha node" on 02 says Secondary + sync SUCCESS) ========
set ha node -haStatus ENABLED
save ns config

# SSL keys: on THIS box (primary) only; sync copies them. Copy files to /nsconfig/ssl with WinSCP, then:
# add ssl certKey <CERTKEY_NAME> -cert <CERT_FILE> -key <KEY_FILE>
# save ns config
