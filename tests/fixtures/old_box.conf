#NS13.0 Build 92.21
# Synthetic sample for tests - not a real box
set ns config -IPAddress 10.10.0.5 -netmask 255.255.255.0 -timezone "GMT-05:00-EST-America/New_York"
set ns hostName old-adc-01
enable ns feature LB CS SSL REWRITE RESPONDER
add ns ip 10.10.1.20 255.255.255.0 -vServer DISABLED -type SNIP
add ns ip6 fe80::1234/64 -scope link -type NSIP
set ns ip 10.10.0.5 -gui SECUREONLY
add HA node 1 10.10.0.6
set HA node -failSafe ON
add ns rpcNode 10.10.0.6 -password 8a1b2c -encrypted -encryptmethod ENCMTHD_3 -kek -suffix 2021_01_01_00_00_00
set system user nsroot 0123abcd -encrypted -hashmethod SHA512
add system user ops 0a0b0c -encrypted -hashmethod SHA512
add channel LA/1 -ifnum 1/1 1/2
add vlan 20
bind vlan 20 -ifnum LA/1 -tagged
bind vlan 20 -IPAddress 10.10.1.20 255.255.255.0
set interface 0/1 -haMonitor OFF
add server web1 10.20.0.11
add server web2 10.20.0.12
add serviceGroup sg_web HTTP
bind serviceGroup sg_web web1 80
bind serviceGroup sg_web web2 80
add lb vserver lb_web HTTP 0.0.0.0 0
bind lb vserver lb_web sg_web
add cs vserver cs_app SSL 10.10.1.100 443
add cs policy pol_old -url "/app/*"
add cs policy pol_new -rule "HTTP.REQ.URL.STARTSWITH(\"/api\")"
bind cs vserver cs_app -policyName pol_new -targetLBVserver lb_web -priority 100
add vpn sessionPolicy sp_all ns_true sa_all
add authentication ldapPolicy ldap_pol ns_true ldap_srv
add authentication ldapAction ldap_srv -serverIP 10.30.0.10 -ldapBindDn svc -ldapBindDnPassword 9f8e7d -encrypted -encryptmethod ENCMTHD_3
add rewrite policy rw_hdr "HTTP.REQ.HEADER(\"X-Old\").EXISTS" rw_act
add filter policy f_old -rule "REQ.HTTP.URL CONTAINS /x" -reqAction RESET
add ssl certKey app_ck -cert app.crt -key app.key
add ssl certKey hsm_ck -cert hsm.crt -fipsKey hsmkey1
bind ssl vserver cs_app -certkeyName app_ck
set ssl vserver cs_app -ssl3 ENABLED -tls1 ENABLED -tls12 ENABLED
bind ssl vserver cs_app -cipherName SSL3-RC4-SHA
bind ssl vserver cs_app -cipherName TLS1.2-ECDHE-RSA-AES256-GCM-SHA384
set ssl fips -initHSM Level-2 so pw user pw
add ns partition p_dmz
set snmp engineId 8000173703aabbcc
add route 0.0.0.0 0.0.0.0 10.10.1.1
